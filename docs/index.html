<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#E0115F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ポスティング">
<title>イチカラ ポスティング</title>
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw==" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="css/app.css?v=20261006">
</head>
<body>
<div id="map"></div>

<header id="top">
  <div id="summary"></div>
  <div id="sync" title="同期の状態"></div>
</header>

<div id="toolbar" hidden></div>

<div id="fab">
  <button id="btnLocate" title="現在地">◎</button>
</div>

<section id="sheet" class="sheet" hidden>
  <div class="grip"></div>
  <button class="close" aria-label="閉じる">×</button>
  <div class="body"></div>
</section>

<nav id="tabs">
  <button data-tab="plan">計画</button>
  <button data-tab="today">今日の配布</button>
  <button data-tab="progress">進捗</button>
  <button data-tab="more">その他</button>
</nav>

<div id="modal" hidden><div class="card"></div></div>
<div id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script type="module" src="js/app.js?v=20261006"></script>
</body>
</html>
